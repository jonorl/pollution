name: Build and Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  # Runs the same suites as the Test workflow, so a red build never reaches the VPS.
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./backend/
          push: true
          tags: ghcr.io/jonorl/pollution-api:latest
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker compose -f ~/my-VPS/projects/docker-compose.yml pull pollution-api
            docker compose -f ~/my-VPS/projects/docker-compose.yml up -d pollution-api

      # A green deploy only means the container was recreated. This waits until /health reports this commit, so the
      # new container (not the old one) is answering with a working database, then checks ingest still wants a key.
      - name: Smoke test
        env:
          BASE: https://pollution.jonathan-orlowski.dev
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 18); do
            health=$(curl -s --max-time 10 "$BASE/health" || true)
            if echo "$health" | jq -e --arg v "$EXPECTED_VERSION" '.status == "ok" and .version == $v' > /dev/null 2>&1; then
              echo "New version healthy after $attempt attempt(s)"
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "::error::/health did not report status ok for $EXPECTED_VERSION within 90 seconds. Last response: $health"
              exit 1
            fi
            sleep 5
          done

          curl -fsS --max-time 10 "$BASE/readings?limit=1" | jq -e 'type == "array"' > /dev/null \
            || { echo "::error::GET /readings did not return a list"; exit 1; }

          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -X POST -H "Content-Type: application/json" \
            -d '{"pm1_0":0,"pm2_5":0,"pm10":0}' "$BASE/ingest")
          [ "$status" = 401 ] || { echo "::error::POST /ingest without a key returned $status, expected 401"; exit 1; }

          echo "Smoke test passed"
