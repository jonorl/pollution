name: Release Android app

# Not on every push: the native build takes several minutes. Run it by hand (Actions → Release Android app → Run
# workflow) to get a test APK, or bump "version" in mobile/package.json and push a matching tag to publish a release:
#   git tag mobile-v1.1.0 && git push origin mobile-v1.1.0
on:
  workflow_dispatch:
  push:
    tags: ['mobile-v*']

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Only used to create the release on a tag push.
      contents: write
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A release named after a tag that doesn't match the app's version would ship an APK reporting the wrong one.
      - name: Read the app's version
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "mobile-v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in mobile/package.json"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Without the key the build would fall back to the debug key, and phones refuse to update
      # an installed release with an APK signed by a different key.
      - name: Check the upload key is configured
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Set the four ANDROID_UPLOAD_* secrets first; mobile/README.md explains how"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      - name: Type-check and lint
        run: |
          npm run typecheck
          npm run lint

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Decode the upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
        run: echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      # arm64-v8a covers nearly every phone in use; armeabi-v7a the older 32-bit ones.
      - name: Build the APK
        working-directory: mobile/android
        env:
          ORG_GRADLE_PROJECT_POLLUTION_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.jks
          ORG_GRADLE_PROJECT_POLLUTION_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_POLLUTION_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_POLLUTION_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Name the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "pollution-$VERSION.apk"
          echo "APK=pollution-$VERSION.apk" >> "$GITHUB_ENV"

      - name: Upload the test APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: pollution-apk
          path: mobile/${{ env.APK }}
          retention-days: 14

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "Android app $VERSION" \
            --generate-notes \
            --notes "Download $APK on an Android phone (Android 7 or later) and open it to install. You may need to allow installs from your browser or file manager first."
